name: build-book

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up build tools
        run: make setup
      - name: Build and verify
        run: make check book
      - uses: actions/upload-artifact@v4
        with:
          name: book-preview-${{ runner.os }}
          path: |
            output/*.pdf
            output/*.epub
          retention-days: 3
